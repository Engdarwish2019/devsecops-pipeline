# Secrets come from Vault through the Vault Agent injector (Kubernetes auth).
# Nothing secret is stored in Git, in the image or in a Kubernetes Secret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-api
  namespace: demo-api
  labels:
    app.kubernetes.io/name: demo-api
  annotations:
    checkov.io/skip1: CKV_K8S_11=No CPU limit on purpose to avoid throttling; CPU requests are enforced
    checkov.io/skip2: CKV_K8S_43=CI replaces the tag with the signed digest at deploy time; Kyverno also pins it
    checkov.io/skip3: CKV_K8S_38=The Vault Agent sidecar needs the projected service account token
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo-api
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: demo-api
        vault.hashicorp.com/agent-inject-secret-config: secret/data/demo-api/config
        vault.hashicorp.com/agent-inject-template-config: |
          {{- with secret "secret/data/demo-api/config" -}}
          export DATABASE_URL="{{ .Data.data.database_url }}"
          {{- end }}
    spec:
      serviceAccountName: demo-api
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/engdarwish2019/devsecops-pipeline:main
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: demo-api
  namespace: demo-api
spec:
  selector:
    app.kubernetes.io/name: demo-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: demo-api
  namespace: demo-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: demo-api
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - port: 8080
  egress:
    # DNS and Vault only
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vault
      ports:
        - port: 8200
