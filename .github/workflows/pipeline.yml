name: secure-pipeline

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/engdarwish2019/devsecops-pipeline
  PYTHON_VERSION: "3.12"

jobs:
  # ---------------------------------------------------------------- stage 1: source
  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2.3.9
        env:
          GITHUB_TOKEN: ${{ github.token }}

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install semgrep==1.185.0
      - name: Semgrep scan
        run: >-
          semgrep scan --error --metrics=off
          --config p/python --config p/owasp-top-ten --config p/dockerfile
          --sarif --output semgrep.sarif
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  test:
    name: Tests, lint, dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: app/requirements*.txt
      - run: pip install -r app/requirements.txt -r app/requirements-dev.txt
      - name: ruff
        run: |
          ruff check app
          ruff format --check app
      - name: pytest (coverage gate 90%)
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=90
      - name: pip-audit (SCA)
        run: pip-audit -r app/requirements.txt --strict

  config:
    name: Dockerfile, Kubernetes and Falco checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf  # v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: checkov (Kubernetes + Dockerfile)
        run: |
          pip install checkov==3.4.4
          checkov -d . --framework kubernetes dockerfile --compact --quiet
      - name: Validate Falco rules
        run: >-
          docker run --rm -v "$PWD/falco/rules:/rules:ro" --entrypoint falco
          falcosecurity/falco-no-driver:0.39.2
          -V /etc/falco/falco_rules.yaml -V /rules/demo-api-rules.yaml

  # ---------------------------------------------------------------- stage 2: artifact
  build:
    name: Build, scan, DAST, sign
    needs: [secrets, sast, test, config]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          load: true
          provenance: false
          tags: demo-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: demo-api:ci
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        if: always()
        with:
          sarif_file: trivy.sarif
          category: trivy

      - name: SBOM (Syft, SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          image: demo-api:ci
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Start the app for DAST
        run: |
          docker run -d --name demo-api -p 8080:8080 --read-only --cap-drop ALL demo-api:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/healthz && exit 0
            sleep 1
          done
          docker logs demo-api
          exit 1

      - name: DAST (OWASP ZAP baseline)
        uses: zaproxy/action-baseline@7c4deb10e6261301961c86d65d54a516394f9aed  # v0.14.0
        with:
          target: http://localhost:8080
          rules_file_name: .zap/rules.tsv
          cmd_options: "-I"
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-report

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push
        id: push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          short_sha="${GITHUB_SHA::7}"
          docker tag demo-api:ci "$IMAGE:main"
          docker tag demo-api:ci "$IMAGE:sha-$short_sha"
          docker push "$IMAGE:main"
          docker push "$IMAGE:sha-$short_sha"
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:main" | cut -d@ -f2)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5  # v3.10.1
        if: steps.push.outcome == 'success'

      - name: Sign the image and attach the SBOM (Cosign keyless, GitHub OIDC)
        if: steps.push.outcome == 'success'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$IMAGE@$DIGEST"

      - name: Build provenance (SLSA, GitHub attestations)
        if: steps.push.outcome == 'success'
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018  # v1.4.4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Verify what we just signed
        if: steps.push.outcome == 'success'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign verify "$IMAGE@$DIGEST" \
            --certificate-identity-regexp "^https://github.com/Engdarwish2019/devsecops-pipeline/.github/workflows/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          echo "Signature verified for $IMAGE@$DIGEST"

  # ---------------------------------------------------------------- optional: Vault
  vault-secrets:
    name: Read a CI secret from Vault (OIDC)
    if: vars.VAULT_ADDR != '' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: hashicorp/vault-action@4c06c5ccf5c0761b6029f56cfb1dcf5565918a3b  # v3.4.0
        with:
          url: ${{ vars.VAULT_ADDR }}
          method: jwt
          role: ci
          jwtGithubAudience: https://github.com/Engdarwish2019
          secrets: |
            secret/data/ci/devsecops-pipeline/deploy token | DEPLOY_TOKEN
      - name: Use the secret without printing it
        run: test -n "$DEPLOY_TOKEN" && echo "Vault secret received (${#DEPLOY_TOKEN} characters)"
